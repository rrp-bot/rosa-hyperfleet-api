replicaCount: 2

image:
  repository: quay.io/cbusse_openshift/hyperfleet-operator
  tag: ""
  pullPolicy: IfNotPresent

awsRegion: ""
baseDomain: ""

# Prefix for hyperfleet CRD DynamoDB table names (e.g. "rc01-").
# Maps to the HYPERFLEET_DB_TABLE_PREFIX env var read by the operator binary.
# Required — must be set via helmValues in the ArgoCD Application.
tablePrefix: ""

serviceAccount:
  create: true
  name: hyperfleet-operator
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

compactor:
  enabled: false
  interval: 5m
  retention: 24h
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

nodeSelector: {}
tolerations: []
